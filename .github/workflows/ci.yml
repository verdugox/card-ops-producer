name: ci-producer

on:
  push:
    branches: [ "develop" ]

concurrency:
  group: ci-producer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Job 1: Build con Maven ---
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Detecta pom.xml y Dockerfile automáticamente
      - name: Detect paths (pom.xml / Dockerfile)
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          POM_PATH="$(git ls-files | grep -E '(^|.*/)+pom\.xml$' | head -n1 || true)"
          if [ -z "${POM_PATH}" ]; then
            echo "No pom.xml found" >&2
            exit 1
          fi
          POM_DIR="$(dirname "${POM_PATH}")"
          if [ -f "${POM_DIR}/Dockerfile" ]; then
            DOCKERFILE="${POM_DIR}/Dockerfile"
            CTX_DIR="${POM_DIR}"
          else
            DOCKERFILE="$(git ls-files | grep -E '(^|.*/)+Dockerfile$' | head -n1 || true)"
            if [ -z "${DOCKERFILE}" ]; then
              echo "No Dockerfile found" >&2
              exit 1
            fi
            CTX_DIR="$(dirname "${DOCKERFILE}")"
          fi
          echo "pom_path=${POM_PATH}"     >> "$GITHUB_OUTPUT"
          echo "pom_dir=${POM_DIR}"       >> "$GITHUB_OUTPUT"
          echo "dockerfile=${DOCKERFILE}" >> "$GITHUB_OUTPUT"
          echo "context_dir=${CTX_DIR}"   >> "$GITHUB_OUTPUT"

      - name: Build with Maven (skip tests)
        run: mvn -B -DskipTests -f "${{ steps.paths.outputs.pom_path }}" package

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: producer-jar
          path: ${{ steps.paths.outputs.pom_dir }}/target/*.jar

  # --- Job 2: Docker Build ---
  docker-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR from build job
        uses: actions/download-artifact@v4
        with:
          name: producer-jar
          path: target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: verdugox/card-ops-producer:test

  # --- Job 3: Docker Push ---
  docker-push:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/card-ops-producer
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/card-ops-producer:buildcache
          cache-to:   type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/card-ops-producer:buildcache,mode=max
