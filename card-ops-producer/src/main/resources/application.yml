server:
  port: 8080

spring:
  application:
    name: card-ops-producer
  data:
    redis:
      client-type: lettuce
      host: ${REDIS_HOST:localhost}
      port: 6379

kafka:
  topic: bank.card.replacements.v1
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
  schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
