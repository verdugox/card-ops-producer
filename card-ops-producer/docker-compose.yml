version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports: ["2181:2181"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-lc", "echo ruok | nc -w 2 127.0.0.1 2181 | grep imok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper: { condition: service_healthy }
    ports:
      - "9092:9092"    # ahora sí lo expones al host
      - "29092:29092"  # puerto alternativo para pruebas externas
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL   # 👈 obligatorio
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-lc", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry   # 👈 requerido en 7.6.x
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    ports: ["8081:8081"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-lc", "wget -qO- http://localhost:8081/subjects >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20

  card-ops-producer:
    build: .
    image: verdugox/card-ops-producer:1.0
    depends_on:
      kafka: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
      redis: { condition: service_healthy }
      otel-collector: { condition: service_started }
    environment:
      SERVER_PORT: 8085
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOGSTASH_HOST: logstash:5000
    ports: ["8085:8085"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-lc", "wget -qO- http://localhost:8085/actuator/health | grep UP >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 20
  # --- Consumer (dispatch-consumer) ---

  mongo:
    image: mongo:6
    ports: [ "27018:27017" ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "bash", "-lc", "mongosh --quiet --eval 'db.runCommand({ ping: 1 })' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20

  dispatch-consumer:
    build:
      context: ../../dispatch-consumer/dispatch-consumer  # 👈 relativo al docker-compose.yml
      dockerfile: Dockerfile
    image: verdugox/dispatch-consumer:1.0
    depends_on:
      kafka: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      otel-collector: { condition: service_started }
    environment:
      SERVER_PORT: 8086
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_URI: mongodb://mongo:27017/cardsdb
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOGSTASH_HOST: logstash:5000
    ports: ["8086:8086"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-lc", "wget -qO- http://localhost:8086/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  # --- Exporters & Observability ---

  # Exporta métricas de Kafka (broker)
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    depends_on:
      kafka: { condition: service_healthy }
    command: ["--kafka.server=kafka:9092"]
    ports: [ "9308:9308" ]
    restart: unless-stopped

  # Exporta métricas de Redis
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis:6379
    ports: [ "9121:9121" ]
    restart: unless-stopped

  # Exporta métricas de Mongo
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    depends_on:
      mongo: { condition: service_healthy }
    command:
      - '--mongodb.uri=mongodb://mongo:27017'
    ports: [ "9216:9216" ]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      - card-ops-producer
      - dispatch-consumer
      - kafka-exporter
      - redis-exporter
      - mongodb-exporter
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: [ "9090:9090" ]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.6
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: [ "3000:3000" ]
    restart: unless-stopped

  # --- Tempo (tracing backend para Grafana) ---
  tempo:
    image: grafana/tempo:2.5.0
    command: [ "-config.file=/etc/tempo.yml" ]
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
    ports:
      - "3200:3200"   # API HTTP
    restart: unless-stopped

  # --- OpenTelemetry Collector ---
  otel-collector:
    image: otel/opentelemetry-collector:0.93.0
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "9464:9464" # Exporter Prometheus
    restart: unless-stopped

  # --- ELK ---
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    ports:
      - "5000:5000"
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch
    restart: unless-stopped


  # --- ElasticSearch + Kibana ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    restart: unless-stopped

  apm-server:
    image: docker.elastic.co/apm/apm-server:8.15.0
    depends_on:
      - elasticsearch
    ports:
      - "8200:8200"
    environment:
      - output.elasticsearch.hosts=["http://elasticsearch:9200"]
      - apm-server.host=0.0.0.0:8200

